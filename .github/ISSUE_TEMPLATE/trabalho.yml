name: Trabalho
description: Registrar uma unidade executável do Arede.Me.
title: ""
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Qual problema concreto precisa ser resolvido?
    validations:
      required: true

  - type: textarea
    id: resultado
    attributes:
      label: Resultado esperado
      description: Qual resultado verificável deve existir ao final?
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto governante
      description: Referencie decisões, arquitetura, política, ADR, SPEC ou outro contexto aplicável por UUID, Issue ou link.
    validations:
      required: true

  - type: textarea
    id: dentro
    attributes:
      label: Dentro do escopo
      description: O que esta unidade está autorizada a tratar?
    validations:
      required: true

  - type: textarea
    id: fora
    attributes:
      label: Fora do escopo
      description: O que permanece explicitamente excluído?
    validations:
      required: true

  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      description: Como o resultado será objetivamente verificado?
    validations:
      required: true

  - type: textarea
    id: riscos
    attributes:
      label: Riscos e dados
      description: Declare perfil de rigor, dados envolvidos e gatilhos relevantes. Use os identificadores comum, sensivel ou operacional_critico no texto do contrato.
    validations:
      required: true

  - type: textarea
    id: evidencias
    attributes:
      label: Evidências esperadas
      description: Quais provas deverão demonstrar os critérios de aceite?
    validations:
      required: true

  - type: textarea
    id: dependencias
    attributes:
      label: Dependências e gates
      description: Declare dependências, decisões humanas, ambiente e restrições de executor quando aplicáveis.
    validations:
      required: true

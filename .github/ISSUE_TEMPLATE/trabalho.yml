name: Trabalho
description: Registrar uma entrega, melhoria, correção ou atividade do Arede.Me.
title: "[TRABALHO] "
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: O que precisa ser entregue?
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Por que este trabalho é necessário?

  - type: textarea
    id: escopo
    attributes:
      label: Escopo
      description: O que está incluído e o que não está incluído?
    validations:
      required: true

  - type: textarea
    id: aceite
    attributes:
      label: Critérios de conclusão
      description: Como saberemos que o trabalho terminou corretamente?
    validations:
      required: true

  - type: dropdown
    id: risco
    attributes:
      label: Risco
      options:
        - Comum
        - Sensível
        - Operacional crítico
    validations:
      required: true

  - type: textarea
    id: referencia
    attributes:
      label: Documento governante
      description: Informe o documento do Arede Docs, ADR ou especificação, quando existir.
